workflows:
  android-production-release:
    name: EduCore Android Production Release
    max_build_duration: 60
    environment:
      groups:
        - educore_production
      vars:
        EDUCORE_APK_DOWNLOAD_URL: https://educoreng.online/download/app
      java: 17
    cache:
      cache_paths:
        - $HOME/.gradle/caches
        - $HOME/.gradle/wrapper
    scripts:
      - name: Resolve Android workspace
        script: |
          set -euo pipefail
          if [ -d mobile-native ]; then
            cd mobile-native
          elif [ -f settings.gradle.kts ] && [ -d app ]; then
            :
          else
            echo "Unable to locate mobile-native Android workspace."
            exit 1
          fi
          printf '%s\n' "$(pwd)" > /tmp/educore-android-workspace
      - name: Verify release environment
        script: |
          set -euo pipefail
          cd "$(cat /tmp/educore-android-workspace)"

          missing=0
          for variable in KEYSTORE_BASE64 KEYSTORE_STORE_PASSWORD KEYSTORE_KEY_ALIAS KEYSTORE_KEY_PASSWORD GITHUB_RELEASE_TOKEN; do
            if [ -z "${!variable:-}" ]; then
              echo "Missing required protected variable: $variable"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Production release environment is incomplete."
            exit 1
          fi

          if [ "$KEYSTORE_KEY_ALIAS" != "educore" ]; then
            echo "KEYSTORE_KEY_ALIAS must be educore."
            exit 1
          fi

          mkdir -p .ci-signing
          if printf '' | base64 --decode >/dev/null 2>&1; then
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > .ci-signing/educore-release.jks
          else
            printf '%s' "$KEYSTORE_BASE64" | base64 -D > .ci-signing/educore-release.jks
          fi

          export RELEASE_PROPERTIES="$PWD/.ci-signing/release.properties"
          python3 - <<'PY'
          import os
          from pathlib import Path

          def escape_property(value: str) -> str:
              escaped = []
              for index, char in enumerate(value):
                  if char == "\\":
                      escaped.append("\\\\")
                  elif char == "\n":
                      escaped.append("\\n")
                  elif char == "\r":
                      escaped.append("\\r")
                  elif char == "\t":
                      escaped.append("\\t")
                  elif char in "=:":
                      escaped.append("\\" + char)
                  elif index == 0 and char in " #!":
                      escaped.append("\\" + char)
                  else:
                      escaped.append(char)
              return "".join(escaped)

          values = {
              "storeFile": "educore-release.jks",
              "storePassword": os.environ["KEYSTORE_STORE_PASSWORD"],
              "keyAlias": os.environ["KEYSTORE_KEY_ALIAS"],
              "keyPassword": os.environ["KEYSTORE_KEY_PASSWORD"],
          }
          Path(os.environ["RELEASE_PROPERTIES"]).write_text(
              "".join(f"{key}={escape_property(value)}\n" for key, value in values.items())
          )
          PY

          chmod 600 .ci-signing/educore-release.jks .ci-signing/release.properties
          test -s .ci-signing/educore-release.jks
          test -s .ci-signing/release.properties
          keytool -list \
            -keystore .ci-signing/educore-release.jks \
            -storepass "$KEYSTORE_STORE_PASSWORD" \
            -alias "$KEYSTORE_KEY_ALIAS" >/dev/null

      - name: Verify Firebase config
        script: |
          set -euo pipefail
          cd "$(cat /tmp/educore-android-workspace)"

          # The native project keeps the approved Firebase file outside the
          # normal generated source-set locations. Gradle copies it into the
          # release/debug source sets during configuration.
          if [ -s app/firebase/google-services.json ]; then
            echo "Using app/firebase/google-services.json."
          elif [ -s ../mobile/android/app/google-services.json ]; then
            echo "Using legacy mobile/android/app/google-services.json."
          else
            echo "Approved Firebase google-services.json is missing. Production push notifications cannot work without it."
            exit 1
          fi
      - name: Run native unit tests, lint and debug build
        script: |
          set -euo pipefail
          cd "$(cat /tmp/educore-android-workspace)"
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug
      - name: Build signed production APK
        script: |
          set -euo pipefail
          cd "$(cat /tmp/educore-android-workspace)"
          ./gradlew --no-daemon \
            -PEDUCORE_RELEASE_PROPERTIES=.ci-signing/release.properties \
            lintRelease assembleRelease

          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          cp "$APK" app/build/outputs/apk/release/EduCore.apk
          sha256sum app/build/outputs/apk/release/EduCore.apk > app/build/outputs/apk/release/EduCore.apk.sha256
      - name: Verify release APK signing certificate
        script: |
          set -euo pipefail
          cd "$(cat /tmp/educore-android-workspace)"
          APK="app/build/outputs/apk/release/EduCore.apk"
          test -s "$APK"

          SIGNER_OUTPUT="$(keytool -printcert -jarfile "$APK")"
          printf '%s\n' "$SIGNER_OUTPUT"

          SIGNER_SHA256="$(printf '%s\n' "$SIGNER_OUTPUT" | sed -n 's/^[[:space:]]*SHA256:[[:space:]]*//p' | head -n1 | tr -d '[:space:]')"
          if [ -z "$SIGNER_SHA256" ]; then
            echo "Unable to read APK signer SHA-256 fingerprint."
            exit 1
          fi

          EXPECTED_SHA256="F170B538AD1DCD796605BEA61DDA69348205203449224681D044D6E2C856E4A0"
          NORMALIZED_SIGNER_SHA256="$(printf '%s' "$SIGNER_SHA256" | tr -d ':' | tr '[:lower:]' '[:upper:]')"
          if [ "$NORMALIZED_SIGNER_SHA256" != "$EXPECTED_SHA256" ]; then
            echo "Release APK signer fingerprint does not match the permanent EduCore production identity."
            exit 1
          fi
      - name: Publish production APK to GitHub Release
        script: |
          set -euo pipefail
          cd "$(cat /tmp/educore-android-workspace)"

          REPO="abubakarshaaba-ctrl/educore"
          APK="app/build/outputs/apk/release/EduCore.apk"
          CHECKSUM="app/build/outputs/apk/release/EduCore.apk.sha256"
          SHORT_SHA="$(printf '%s' "${CM_COMMIT:?CM_COMMIT is required}" | cut -c1-12)"
          BUILD_NO="${BUILD_NUMBER:?BUILD_NUMBER is required}"

          read -r VERSION_CODE VERSION_NAME <<EOF
          $(python3 - <<'PY'
          import re
          from pathlib import Path

          text = Path("app/build.gradle.kts").read_text()
          code = re.search(r'\bversionCode\s*=\s*(\d+)', text)
          name = re.search(r'\bversionName\s*=\s*"([^"]+)"', text)
          if not code or not name:
              raise SystemExit("Unable to read versionCode/versionName from app/build.gradle.kts")
          print(code.group(1), name.group(1))
          PY
          )
          EOF

          TAG="android-v${VERSION_NAME}-code${VERSION_CODE}-b${BUILD_NO}-${SHORT_SHA}"
          RELEASE_NAME="EduCore Android ${VERSION_NAME} (versionCode ${VERSION_CODE}, Codemagic ${BUILD_NO})"

          test -s "$APK"
          test -s "$CHECKSUM"
          test -n "${GITHUB_RELEASE_TOKEN:-}"

          export TAG RELEASE_NAME REPO VERSION_CODE VERSION_NAME BUILD_NO SHORT_SHA
          python3 - <<'PY' > /tmp/educore-release-request.json
          import json
          import os

          print(json.dumps({
              "tag_name": os.environ["TAG"],
              "target_commitish": os.environ["CM_COMMIT"],
              "name": os.environ["RELEASE_NAME"],
              "body": (
                  "Automated signed EduCore Android production release.\n\n"
                  f"- Package: online.educoreng.educore\n"
                  f"- versionCode: {os.environ['VERSION_CODE']}\n"
                  f"- versionName: {os.environ['VERSION_NAME']}\n"
                  f"- Codemagic build: {os.environ['BUILD_NO']}\n"
                  f"- Commit: {os.environ['CM_COMMIT']}"
              ),
              "draft": True,
              "prerelease": False,
          }))
          PY

          CREATE_STATUS="$(curl -sS \
            -o /tmp/educore-release-response.json \
            -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer $GITHUB_RELEASE_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "Content-Type: application/json" \
            "https://api.github.com/repos/$REPO/releases" \
            --data-binary @/tmp/educore-release-request.json)"
          if [ "$CREATE_STATUS" != "201" ]; then
            echo "GitHub release creation failed with HTTP $CREATE_STATUS."
            cat /tmp/educore-release-response.json || true
            exit 1
          fi

          RELEASE_ID="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["id"])' /tmp/educore-release-response.json)"

          APK_STATUS="$(curl -sS \
            -o /tmp/educore-apk-upload.json \
            -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer $GITHUB_RELEASE_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "Content-Type: application/vnd.android.package-archive" \
            "https://uploads.github.com/repos/$REPO/releases/$RELEASE_ID/assets?name=EduCore.apk" \
            --data-binary "@$APK")"
          if [ "$APK_STATUS" != "201" ]; then
            echo "GitHub APK upload failed with HTTP $APK_STATUS; the incomplete release remains a draft."
            exit 1
          fi

          CHECKSUM_STATUS="$(curl -sS \
            -o /tmp/educore-checksum-upload.json \
            -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer $GITHUB_RELEASE_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "Content-Type: text/plain" \
            "https://uploads.github.com/repos/$REPO/releases/$RELEASE_ID/assets?name=EduCore.apk.sha256" \
            --data-binary "@$CHECKSUM")"
          if [ "$CHECKSUM_STATUS" != "201" ]; then
            echo "GitHub checksum upload failed with HTTP $CHECKSUM_STATUS; the incomplete release remains a draft."
            exit 1
          fi

          PUBLISH_STATUS="$(curl -sS \
            -o /tmp/educore-publish-response.json \
            -w '%{http_code}' \
            -X PATCH \
            -H "Authorization: Bearer $GITHUB_RELEASE_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "Content-Type: application/json" \
            "https://api.github.com/repos/$REPO/releases/$RELEASE_ID" \
            --data '{"draft":false}')"
          if [ "$PUBLISH_STATUS" != "200" ]; then
            echo "GitHub release publication failed with HTTP $PUBLISH_STATUS; the release remains a draft."
            exit 1
          fi

          echo "Published EduCore production release $TAG with APK and checksum assets."

      - name: Update notification handoff
        script: |
          set -euo pipefail
          echo "GitHub release published. EduCore server deployment will sync /download/app, record release metadata and notify installed apps."

    artifacts:
      - mobile-native/app/build/outputs/apk/debug/app-debug.apk
      - mobile-native/app/build/reports/lint-results-debug.html
      - mobile-native/app/build/reports/lint-results-release.html
      - mobile-native/app/build/outputs/apk/release/app-release.apk
      - mobile-native/app/build/outputs/apk/release/EduCore.apk
      - mobile-native/app/build/outputs/apk/release/EduCore.apk.sha256
