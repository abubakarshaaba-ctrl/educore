workflows:
  native-android-validation:
    name: EduCore Native Android Validation
    max_build_duration: 45
    instance_type: mac_mini_m2
    working_directory: mobile-native
    environment:
      java: 21
    cache:
      cache_paths:
        - $HOME/.gradle/caches
        - $HOME/.gradle/wrapper
    scripts:
      - name: Configure Android SDK
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          chmod +x gradlew

      - name: Prepare Firebase configuration
        script: |
          set -e
          SOURCE="app/firebase/google-services.json"
          if [ ! -f "$SOURCE" ]; then
            echo "Missing $SOURCE"
            exit 1
          fi
          mkdir -p app/src/debug app/src/release
          cp "$SOURCE" app/src/release/google-services.json
          python3 - <<'PY'
          from pathlib import Path
          src = Path('app/firebase/google-services.json')
          dst = Path('app/src/debug/google-services.json')
          text = src.read_text()
          text = text.replace('"package_name": "online.educoreng.educore"', '"package_name": "online.educoreng.educore.nativepreview"')
          dst.write_text(text)
          PY
          test -s app/src/debug/google-services.json
          test -s app/src/release/google-services.json

      - name: Run native unit tests, lint and debug build
        script: |
          ./gradlew --no-daemon --no-parallel \
            :core:common:testDebugUnitTest \
            :core:designsystem:testDebugUnitTest \
            :core:model:testDebugUnitTest \
            :core:network:testDebugUnitTest \
            :core:security:testDebugUnitTest \
            :core:data:testDebugUnitTest \
            :app:testDebugUnitTest \
            :app:lintDebug \
            :app:assembleDebug

      - name: Prepare optional release signing
        script: |
          set -e
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_STORE_PASSWORD" ] || [ -z "$KEYSTORE_KEY_PASSWORD" ] || [ -z "$KEYSTORE_KEY_ALIAS" ]; then
            echo "Release signing variables are not configured; keeping this as a validated debug build."
            exit 0
          fi
          mkdir -p .ci-signing
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > .ci-signing/educore-release.jks
          {
            echo 'storeFile=educore-release.jks'
            echo "storePassword=$KEYSTORE_STORE_PASSWORD"
            echo "keyAlias=$KEYSTORE_KEY_ALIAS"
            echo "keyPassword=$KEYSTORE_KEY_PASSWORD"
          } > .ci-signing/release.properties
          chmod 600 .ci-signing/educore-release.jks .ci-signing/release.properties

      - name: Build optional signed release APK
        script: |
          set -e
          if [ ! -s .ci-signing/release.properties ]; then
            echo "Signed release skipped."
            exit 0
          fi
          ./gradlew --no-daemon --no-parallel \
            -PEDUCORE_RELEASE_PROPERTIES=.ci-signing/release.properties \
            :app:lintRelease \
            :app:assembleRelease
          cp app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/EduCore.apk
          shasum -a 256 app/build/outputs/apk/release/EduCore.apk > app/build/outputs/apk/release/EduCore.apk.sha256

      - name: Publish signed APK to GitHub Releases
        script: |
          set -e
          APK="app/build/outputs/apk/release/EduCore.apk"
          CHECKSUM="app/build/outputs/apk/release/EduCore.apk.sha256"

          if [ ! -s "$APK" ]; then
            echo "No signed release APK exists; GitHub release publishing skipped."
            exit 0
          fi

          if [ -z "$GITHUB_RELEASE_TOKEN" ]; then
            echo "GITHUB_RELEASE_TOKEN is not configured; signed APK remains available as a Codemagic artifact only."
            exit 0
          fi

          REPO="abubakarshaaba-ctrl/educore"
          SHORT_SHA="$(printf '%s' "${CM_COMMIT:-unknown}" | cut -c1-12)"
          BUILD_NO="${CM_BUILD_NUMBER:-0}"
          TAG="android-${BUILD_NO}-${SHORT_SHA}"
          RELEASE_NAME="EduCore Android ${BUILD_NO} (${SHORT_SHA})"

          export TAG RELEASE_NAME REPO
          python3 - <<'PY' > /tmp/educore-release.json
          import json, os
          print(json.dumps({
              "tag_name": os.environ["TAG"],
              "target_commitish": os.environ.get("CM_COMMIT") or "mobile-build",
              "name": os.environ["RELEASE_NAME"],
              "body": "Automated signed EduCore Android release produced by Codemagic.",
              "draft": False,
              "prerelease": False,
          }))
          PY

          RESPONSE="$(curl --fail-with-body -sS \
            -X POST \
            -H "Authorization: Bearer $GITHUB_RELEASE_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "Content-Type: application/json" \
            "https://api.github.com/repos/$REPO/releases" \
            --data-binary @/tmp/educore-release.json)"

          RELEASE_ID="$(printf '%s' "$RESPONSE" | python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])')"

          curl --fail-with-body -sS \
            -X POST \
            -H "Authorization: Bearer $GITHUB_RELEASE_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/vnd.android.package-archive" \
            "https://uploads.github.com/repos/$REPO/releases/$RELEASE_ID/assets?name=EduCore.apk" \
            --data-binary "@$APK" > /tmp/educore-apk-upload.json

          curl --fail-with-body -sS \
            -X POST \
            -H "Authorization: Bearer $GITHUB_RELEASE_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: text/plain" \
            "https://uploads.github.com/repos/$REPO/releases/$RELEASE_ID/assets?name=EduCore.apk.sha256" \
            --data-binary "@$CHECKSUM" > /tmp/educore-checksum-upload.json

          echo "Published signed EduCore.apk to GitHub release $TAG"

    artifacts:
      - app/build/outputs/apk/debug/app-debug.apk
      - app/build/reports/lint-results-debug.html
      - app/build/outputs/apk/release/app-release.apk
      - app/build/outputs/apk/release/EduCore.apk
      - app/build/outputs/apk/release/EduCore.apk.sha256
