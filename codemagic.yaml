workflows:
  android-production-release:
    name: EduCore Android Production Release
    max_build_duration: 60
    environment:
      groups:
        - educore_production
      vars:
        CM_KEYSTORE_PATH: /tmp/educore-release.keystore
        EDUCORE_APK_DOWNLOAD_URL: https://educoreng.online/download/app
        MOBILE_RELEASE_NOTIFY_URL: https://educoreng.online/api/v1/mobile-release/notify
      java: 17
    cache:
      cache_paths:
        - $HOME/.gradle/caches
        - $HOME/.gradle/wrapper
    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: 'android-v*'
          include: true
    scripts:
      - name: Resolve Android workspace
        script: |
          set -euo pipefail
          if [ -d mobile-native ]; then
            cd mobile-native
          elif [ -f settings.gradle.kts ] && [ -d app ]; then
            :
          else
            echo "Unable to locate mobile-native Android workspace."
            exit 1
          fi
          printf '%s\n' "$(pwd)" > /tmp/educore-android-workspace
      - name: Verify release environment
        script: |
          set -euo pipefail
          cd "$(cat /tmp/educore-android-workspace)"

          missing=0
          for variable in CM_KEYSTORE_BASE64 CM_KEYSTORE_PASSWORD CM_KEY_ALIAS CM_KEY_PASSWORD GITHUB_RELEASE_TOKEN MOBILE_RELEASE_WEBHOOK_TOKEN; do
            if [ -z "${!variable:-}" ]; then
              echo "Missing required protected variable: $variable"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Production release environment is incomplete."
            exit 1
          fi

          printf '%s' "$CM_KEYSTORE_BASE64" | base64 --decode > "$CM_KEYSTORE_PATH"
          test -s "$CM_KEYSTORE_PATH"
          chmod 600 "$CM_KEYSTORE_PATH"

          cat > keystore.properties <<EOF
          storeFile=$CM_KEYSTORE_PATH
          storePassword=$CM_KEYSTORE_PASSWORD
          keyAlias=$CM_KEY_ALIAS
          keyPassword=$CM_KEY_PASSWORD
          EOF
          chmod 600 keystore.properties
      - name: Verify Firebase config
        script: |
          set -euo pipefail
          cd "$(cat /tmp/educore-android-workspace)"
          test -s app/google-services.json || {
            echo "app/google-services.json is missing. Production push notifications cannot work without it."
            exit 1
          }
      - name: Run native unit tests, lint and debug build
        script: |
          set -euo pipefail
          cd "$(cat /tmp/educore-android-workspace)"
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug
      - name: Build signed production APK
        script: |
          set -euo pipefail
          cd "$(cat /tmp/educore-android-workspace)"
          ./gradlew --no-daemon lintRelease assembleRelease

          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          cp "$APK" app/build/outputs/apk/release/EduCore.apk
          sha256sum app/build/outputs/apk/release/EduCore.apk > app/build/outputs/apk/release/EduCore.apk.sha256
      - name: Verify release APK signing certificate
        script: |
          set -euo pipefail
          cd "$(cat /tmp/educore-android-workspace)"
          APK="app/build/outputs/apk/release/EduCore.apk"
          test -s "$APK"

          SIGNER_OUTPUT="$(keytool -printcert -jarfile "$APK")"
          printf '%s\n' "$SIGNER_OUTPUT"

          SIGNER_SHA256="$(printf '%s\n' "$SIGNER_OUTPUT" | sed -n 's/^[[:space:]]*SHA256:[[:space:]]*//p' | head -n1 | tr -d '[:space:]')"
          if [ -z "$SIGNER_SHA256" ]; then
            echo "Unable to read APK signer SHA-256 fingerprint."
            exit 1
          fi

          if [ -n "${EDUCORE_RELEASE_CERT_SHA256:-}" ]; then
            EXPECTED_SHA256="$(printf '%s' "$EDUCORE_RELEASE_CERT_SHA256" | tr -d '[:space:]')"
            if [ "$SIGNER_SHA256" != "$EXPECTED_SHA256" ]; then
              echo "Release APK signer fingerprint does not match EDUCORE_RELEASE_CERT_SHA256."
              exit 1
            fi
          else
            echo "EDUCORE_RELEASE_CERT_SHA256 is not configured; signer fingerprint was printed for first-release pinning."
          fi
      - name: Publish production APK to GitHub Release
        script: |
          set -euo pipefail
          cd "$(cat /tmp/educore-android-workspace)"

          REPO="abubakarshaaba-ctrl/educore"
          TAG="${CM_TAG:-}"
          if [ -z "$TAG" ]; then
            echo "This workflow must run from an android-v* tag."
            exit 1
          fi

          APK="app/build/outputs/apk/release/EduCore.apk"
          CHECKSUM="app/build/outputs/apk/release/EduCore.apk.sha256"
          test -s "$APK"
          test -s "$CHECKSUM"

          RELEASE_JSON="$(curl -fsS \
            -H "Authorization: Bearer $GITHUB_RELEASE_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPO/releases/tags/$TAG" || true)"

          if [ -n "$RELEASE_JSON" ]; then
            printf '%s' "$RELEASE_JSON" > /tmp/educore-release.json
            RELEASE_ID="$(python3 - <<'PY'
          import json
          with open('/tmp/educore-release.json', encoding='utf-8') as fh:
              print(json.load(fh)['id'])
          PY
            )"
          else
            export TAG
            python3 - <<'PY' > /tmp/educore-release-create.json
          import json, os
          tag = os.environ['TAG']
          print(json.dumps({
              'tag_name': tag,
              'target_commitish': os.environ.get('CM_COMMIT', 'mobile-build'),
              'name': f'EduCore Android {tag}',
              'body': 'Signed EduCore Android production release.',
              'draft': True,
              'prerelease': False,
          }))
          PY
            CREATE_STATUS="$(curl -sS \
              -o /tmp/educore-release-created.json \
              -w '%{http_code}' \
              -X POST \
              -H "Authorization: Bearer $GITHUB_RELEASE_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              -H "Content-Type: application/json" \
              "https://api.github.com/repos/$REPO/releases" \
              --data-binary @/tmp/educore-release-create.json)"
            if [ "$CREATE_STATUS" != "201" ]; then
              echo "Failed to create GitHub release (HTTP $CREATE_STATUS)."
              cat /tmp/educore-release-created.json || true
              exit 1
            fi
            RELEASE_ID="$(python3 - <<'PY'
          import json
          with open('/tmp/educore-release-created.json', encoding='utf-8') as fh:
              print(json.load(fh)['id'])
          PY
            )"
          fi

          curl -fsS \
            -H "Authorization: Bearer $GITHUB_RELEASE_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPO/releases/$RELEASE_ID/assets?per_page=100" \
            > /tmp/educore-release-assets.json

          for asset in EduCore.apk EduCore.apk.sha256; do
            ASSET_ID="$(ASSET_NAME="$asset" python3 - <<'PY'
          import json, os
          with open('/tmp/educore-release-assets.json', encoding='utf-8') as fh:
              assets = json.load(fh)
          target = os.environ['ASSET_NAME']
          print(next((a['id'] for a in assets if a.get('name') == target), ''))
          PY
            )"
            if [ -n "$ASSET_ID" ]; then
              curl -fsS \
                -X DELETE \
                -H "Authorization: Bearer $GITHUB_RELEASE_TOKEN" \
                -H "Accept: application/vnd.github+json" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "https://api.github.com/repos/$REPO/releases/assets/$ASSET_ID"
            fi
          done

          curl -fsS \
            -X POST \
            -H "Authorization: Bearer $GITHUB_RELEASE_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "Content-Type: application/vnd.android.package-archive" \
            --data-binary @"$APK" \
            "https://uploads.github.com/repos/$REPO/releases/$RELEASE_ID/assets?name=EduCore.apk"

          curl -fsS \
            -X POST \
            -H "Authorization: Bearer $GITHUB_RELEASE_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "Content-Type: text/plain" \
            --data-binary @"$CHECKSUM" \
            "https://uploads.github.com/repos/$REPO/releases/$RELEASE_ID/assets?name=EduCore.apk.sha256"

          PUBLISH_STATUS="$(curl -sS \
            -o /tmp/educore-publish-response.json \
            -w '%{http_code}' \
            -X PATCH \
            -H "Authorization: Bearer $GITHUB_RELEASE_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "Content-Type: application/json" \
            "https://api.github.com/repos/$REPO/releases/$RELEASE_ID" \
            --data '{"draft":false}')"
          if [ "$PUBLISH_STATUS" != "200" ]; then
            echo "GitHub release publication failed with HTTP $PUBLISH_STATUS; the release remains a draft."
            exit 1
          fi

          echo "Published EduCore production release $TAG with APK and checksum assets."

      - name: Notify installed apps about production release
        script: |
          set -euo pipefail

          if [ -z "${MOBILE_RELEASE_WEBHOOK_TOKEN:-}" ]; then
            echo "MOBILE_RELEASE_WEBHOOK_TOKEN is required. Refusing to silently publish an Android release without update metadata and push notification."
            exit 1
          fi

          RELEASE_NOTIFY_URL="${MOBILE_RELEASE_NOTIFY_URL:-https://educoreng.online/api/v1/mobile-release/notify}"
          DOWNLOAD_URL="${EDUCORE_APK_DOWNLOAD_URL:-https://educoreng.online/download/app}"

          cd "$(cat /tmp/educore-android-workspace)"
          read -r VERSION_CODE VERSION_NAME <<EOF
          $(python3 - <<'PY'
          import re
          from pathlib import Path

          text = Path("app/build.gradle.kts").read_text()
          code = re.search(r'\bversionCode\s*=\s*(\d+)', text)
          name = re.search(r'\bversionName\s*=\s*"([^"]+)"', text)
          if not code or not name:
              raise SystemExit("Unable to read versionCode/versionName from app/build.gradle.kts")
          print(code.group(1), name.group(1))
          PY
          )
          EOF

          export VERSION_CODE VERSION_NAME DOWNLOAD_URL
          python3 - <<'PY' > /tmp/educore-update-notification.json
          import json
          import os

          print(json.dumps({
              "version_name": os.environ["VERSION_NAME"],
              "version_code": int(os.environ["VERSION_CODE"]),
              "download_url": os.environ["DOWNLOAD_URL"],
              "message": f"EduCore {os.environ['VERSION_NAME']} is ready to install. Tap to update.",
              "force_update": False,
          }))
          PY

          NOTIFY_STATUS="$(curl -sS \
            -o /tmp/educore-update-notification-response.json \
            -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer $MOBILE_RELEASE_WEBHOOK_TOKEN" \
            -H "Content-Type: application/json" \
            "$RELEASE_NOTIFY_URL" \
            --data-binary @/tmp/educore-update-notification.json)"

          if [ "$NOTIFY_STATUS" != "200" ]; then
            echo "Release was published, but app update notification failed with HTTP $NOTIFY_STATUS."
            cat /tmp/educore-update-notification-response.json || true
            exit 1
          fi

          echo "Installed EduCore apps were notified about version $VERSION_NAME (code $VERSION_CODE)."

    artifacts:
      - mobile-native/app/build/outputs/apk/debug/app-debug.apk
      - mobile-native/app/build/reports/lint-results-debug.html
      - mobile-native/app/build/reports/lint-results-release.html
      - mobile-native/app/build/outputs/apk/release/app-release.apk
      - mobile-native/app/build/outputs/apk/release/EduCore.apk
      - mobile-native/app/build/outputs/apk/release/EduCore.apk.sha256
