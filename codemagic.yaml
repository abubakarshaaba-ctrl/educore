workflows:
  native-android-validation:
    name: EduCore Native Android Validation
    max_build_duration: 45
    instance_type: mac_mini_m2
    working_directory: mobile-native
    environment:
      java: 21
    cache:
      cache_paths:
        - $HOME/.gradle/caches
        - $HOME/.gradle/wrapper
    scripts:
      - name: Configure Android SDK
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          chmod +x gradlew

      - name: Prepare Firebase configuration
        script: |
          set -e
          SOURCE="app/firebase/google-services.json"
          if [ ! -f "$SOURCE" ]; then
            echo "Missing $SOURCE"
            exit 1
          fi
          mkdir -p app/src/debug app/src/release
          cp "$SOURCE" app/src/release/google-services.json
          python3 - <<'PY'
          from pathlib import Path
          src = Path('app/firebase/google-services.json')
          dst = Path('app/src/debug/google-services.json')
          text = src.read_text()
          text = text.replace('"package_name": "online.educoreng.educore"', '"package_name": "online.educoreng.educore.nativepreview"')
          dst.write_text(text)
          PY
          test -s app/src/debug/google-services.json
          test -s app/src/release/google-services.json

      - name: Run native unit tests, lint and debug build
        script: |
          ./gradlew --no-daemon --no-parallel \
            :core:common:testDebugUnitTest \
            :core:designsystem:testDebugUnitTest \
            :core:model:testDebugUnitTest \
            :core:network:testDebugUnitTest \
            :core:security:testDebugUnitTest \
            :core:data:testDebugUnitTest \
            :app:testDebugUnitTest \
            :app:lintDebug \
            :app:assembleDebug

      - name: Prepare optional release signing
        script: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_STORE_PASSWORD" ] || [ -z "$KEYSTORE_KEY_PASSWORD" ] || [ -z "$KEYSTORE_KEY_ALIAS" ]; then
            echo "Release signing variables are not configured; keeping this as a validated debug build."
            exit 0
          fi
          mkdir -p .ci-signing
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > .ci-signing/educore-release.jks
          {
            echo 'storeFile=educore-release.jks'
            echo "storePassword=$KEYSTORE_STORE_PASSWORD"
            echo "keyAlias=$KEYSTORE_KEY_ALIAS"
            echo "keyPassword=$KEYSTORE_KEY_PASSWORD"
          } > .ci-signing/release.properties

      - name: Build optional signed release APK
        script: |
          if [ ! -s .ci-signing/release.properties ]; then
            echo "Signed release skipped."
            exit 0
          fi
          ./gradlew --no-daemon --no-parallel \
            -PEDUCORE_RELEASE_PROPERTIES=.ci-signing/release.properties \
            :app:lintRelease \
            :app:assembleRelease
          shasum -a 256 app/build/outputs/apk/release/app-release.apk > app/build/outputs/apk/release/app-release.apk.sha256

    artifacts:
      - app/build/outputs/apk/debug/app-debug.apk
      - app/build/reports/lint-results-debug.html
      - app/build/outputs/apk/release/app-release.apk
      - app/build/outputs/apk/release/app-release.apk.sha256
