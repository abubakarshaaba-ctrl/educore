workflows:
  native-android-production:
    name: EduCore Native Android Production
    max_build_duration: 45
    instance_type: mac_mini_m2
    working_directory: mobile-native
    environment:
      groups:
        - educore_production
      java: 21
    cache:
      cache_paths:
        - $HOME/.gradle/caches
        - $HOME/.gradle/wrapper
    scripts:
      - name: Configure Android SDK
        script: |
          set -euo pipefail
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          chmod +x gradlew

      - name: Prepare Firebase configuration
        script: |
          set -euo pipefail
          SOURCE="app/firebase/google-services.json"
          if [ ! -f "$SOURCE" ]; then
            echo "Missing $SOURCE"
            exit 1
          fi
          mkdir -p app/src/debug app/src/release
          cp "$SOURCE" app/src/release/google-services.json
          python3 - <<'PY'
          from pathlib import Path

          src = Path("app/firebase/google-services.json")
          dst = Path("app/src/debug/google-services.json")
          text = src.read_text()
          text = text.replace(
              '"package_name": "online.educoreng.educore"',
              '"package_name": "online.educoreng.educore.nativepreview"',
          )
          dst.write_text(text)
          PY
          test -s app/src/debug/google-services.json
          test -s app/src/release/google-services.json

      - name: Run native unit tests, lint and debug build
        script: |
          set -euo pipefail
          ./gradlew --no-daemon --no-parallel \
            :core:common:testDebugUnitTest \
            :core:designsystem:testDebugUnitTest \
            :core:model:testDebugUnitTest \
            :core:network:testDebugUnitTest \
            :core:security:testDebugUnitTest \
            :core:data:testDebugUnitTest \
            :app:testDebugUnitTest \
            :app:lintDebug \
            :app:assembleDebug

      - name: Prepare protected production signing
        script: |
          set -euo pipefail

          missing=0
          for name in \
            KEYSTORE_BASE64 \
            KEYSTORE_STORE_PASSWORD \
            KEYSTORE_KEY_PASSWORD \
            KEYSTORE_KEY_ALIAS \
            GITHUB_RELEASE_TOKEN
          do
            if [ -z "${!name:-}" ]; then
              echo "Missing required protected variable: $name"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

          if [ "$KEYSTORE_KEY_ALIAS" != "educore" ]; then
            echo "KEYSTORE_KEY_ALIAS must be educore."
            exit 1
          fi

          mkdir -p .ci-signing
          if printf '' | base64 --decode >/dev/null 2>&1; then
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > .ci-signing/educore-release.jks
          else
            printf '%s' "$KEYSTORE_BASE64" | base64 -D > .ci-signing/educore-release.jks
          fi

          export RELEASE_PROPERTIES="$PWD/.ci-signing/release.properties"
          python3 - <<'PY'
          import os
          from pathlib import Path

          def escape_property(value: str) -> str:
              escaped = []
              for index, char in enumerate(value):
                  if char == "\\":
                      escaped.append("\\\\")
                  elif char == "\n":
                      escaped.append("\\n")
                  elif char == "\r":
                      escaped.append("\\r")
                  elif char == "\t":
                      escaped.append("\\t")
                  elif char in "=:":
                      escaped.append("\\" + char)
                  elif index == 0 and char in " #!":
                      escaped.append("\\" + char)
                  else:
                      escaped.append(char)
              return "".join(escaped)

          values = {
              "storeFile": "educore-release.jks",
              "storePassword": os.environ["KEYSTORE_STORE_PASSWORD"],
              "keyAlias": os.environ["KEYSTORE_KEY_ALIAS"],
              "keyPassword": os.environ["KEYSTORE_KEY_PASSWORD"],
          }
          content = "".join(
              f"{key}={escape_property(value)}\n" for key, value in values.items()
          )
          Path(os.environ["RELEASE_PROPERTIES"]).write_text(content)
          PY

          chmod 600 .ci-signing/educore-release.jks .ci-signing/release.properties
          test -s .ci-signing/educore-release.jks
          test -s .ci-signing/release.properties
          keytool -list \
            -keystore .ci-signing/educore-release.jks \
            -storepass "$KEYSTORE_STORE_PASSWORD" \
            -alias "$KEYSTORE_KEY_ALIAS" >/dev/null

      - name: Run release lint and build signed APK
        script: |
          set -euo pipefail
          ./gradlew --no-daemon --no-parallel \
            -PEDUCORE_RELEASE_PROPERTIES=.ci-signing/release.properties \
            :app:lintRelease \
            :app:assembleRelease

          RELEASE_DIR="app/build/outputs/apk/release"
          test -s "$RELEASE_DIR/app-release.apk"
          cp "$RELEASE_DIR/app-release.apk" "$RELEASE_DIR/EduCore.apk"

      - name: Verify production APK identity and signature
        script: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/EduCore.apk"
          EXPECTED_APPLICATION_ID="online.educoreng.educore"
          EXPECTED_VERSION_CODE="16"
          EXPECTED_VERSION_NAME="2.0.0-alpha03"
          EXPECTED_CERT_SHA256="F170B538AD1DCD796605BEA61DDA69348205203449224681D044D6E2C856E4A0"

          APKSIGNER="$(find "$ANDROID_SDK_ROOT/build-tools" -type f -name apksigner 2>/dev/null | sort | tail -n 1)"
          AAPT="$(find "$ANDROID_SDK_ROOT/build-tools" -type f -name aapt 2>/dev/null | sort | tail -n 1)"
          if [ -z "$APKSIGNER" ] || [ ! -x "$APKSIGNER" ]; then
            echo "Android apksigner was not found."
            exit 1
          fi
          if [ -z "$AAPT" ] || [ ! -x "$AAPT" ]; then
            echo "Android aapt was not found."
            exit 1
          fi

          VERIFY_OUTPUT="$("$APKSIGNER" verify --verbose --print-certs "$APK")"
          CERT_SHA256="$(printf '%s\n' "$VERIFY_OUTPUT" \
            | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' \
            | tr -d ':\r' \
            | tr '[:lower:]' '[:upper:]' \
            | head -n 1)"

          if [ "$CERT_SHA256" != "$EXPECTED_CERT_SHA256" ]; then
            echo "Release signing certificate does not match the permanent EduCore production identity."
            exit 1
          fi

          BADGING="$("$AAPT" dump badging "$APK")"
          APPLICATION_ID="$(printf '%s\n' "$BADGING" | sed -n "s/^package: name='\([^']*\)'.*/\1/p" | head -n 1)"
          VERSION_CODE="$(printf '%s\n' "$BADGING" | sed -n "s/^package:.*versionCode='\([^']*\)'.*/\1/p" | head -n 1)"
          VERSION_NAME="$(printf '%s\n' "$BADGING" | sed -n "s/^package:.*versionName='\([^']*\)'.*/\1/p" | head -n 1)"

          if [ "$APPLICATION_ID" != "$EXPECTED_APPLICATION_ID" ]; then
            echo "Unexpected release application ID: $APPLICATION_ID"
            exit 1
          fi
          if [ "$VERSION_CODE" != "$EXPECTED_VERSION_CODE" ]; then
            echo "Unexpected release versionCode: $VERSION_CODE"
            exit 1
          fi
          if [ "$VERSION_NAME" != "$EXPECTED_VERSION_NAME" ]; then
            echo "Unexpected release versionName: $VERSION_NAME"
            exit 1
          fi
          if printf '%s\n' "$BADGING" | grep -q '^application-debuggable'; then
            echo "Release APK is marked debuggable."
            exit 1
          fi

          echo "Verified signed production APK: $APPLICATION_ID, versionCode $VERSION_CODE, versionName $VERSION_NAME."

      - name: Generate release checksum
        script: |
          set -euo pipefail
          RELEASE_DIR="app/build/outputs/apk/release"
          (
            cd "$RELEASE_DIR"
            shasum -a 256 EduCore.apk > EduCore.apk.sha256
          )
          test -s "$RELEASE_DIR/EduCore.apk.sha256"

      - name: Publish production assets to GitHub Releases
        script: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/EduCore.apk"
          CHECKSUM="app/build/outputs/apk/release/EduCore.apk.sha256"
          REPO="abubakarshaaba-ctrl/educore"
          SHORT_SHA="$(printf '%s' "${CM_COMMIT:?CM_COMMIT is required}" | cut -c1-12)"
          BUILD_NO="${CM_BUILD_NUMBER:?CM_BUILD_NUMBER is required}"
          VERSION_CODE="16"
          VERSION_NAME="2.0.0-alpha03"
          TAG="android-v${VERSION_NAME}-code${VERSION_CODE}-b${BUILD_NO}-${SHORT_SHA}"
          RELEASE_NAME="EduCore Android ${VERSION_NAME} (versionCode ${VERSION_CODE}, Codemagic ${BUILD_NO})"

          test -s "$APK"
          test -s "$CHECKSUM"
          test -n "${GITHUB_RELEASE_TOKEN:-}"

          export TAG RELEASE_NAME REPO VERSION_CODE VERSION_NAME BUILD_NO SHORT_SHA
          python3 - <<'PY' > /tmp/educore-release-request.json
          import json
          import os

          print(json.dumps({
              "tag_name": os.environ["TAG"],
              "target_commitish": os.environ["CM_COMMIT"],
              "name": os.environ["RELEASE_NAME"],
              "body": (
                  "Automated signed EduCore Android production release.\n\n"
                  f"- Package: online.educoreng.educore\n"
                  f"- versionCode: {os.environ['VERSION_CODE']}\n"
                  f"- versionName: {os.environ['VERSION_NAME']}\n"
                  f"- Codemagic build: {os.environ['BUILD_NO']}\n"
                  f"- Commit: {os.environ['CM_COMMIT']}"
              ),
              "draft": True,
              "prerelease": False,
          }))
          PY

          CREATE_STATUS="$(curl -sS \
            -o /tmp/educore-release-response.json \
            -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer $GITHUB_RELEASE_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "Content-Type: application/json" \
            "https://api.github.com/repos/$REPO/releases" \
            --data-binary @/tmp/educore-release-request.json)"
          if [ "$CREATE_STATUS" != "201" ]; then
            echo "GitHub release creation failed with HTTP $CREATE_STATUS."
            exit 1
          fi

          RELEASE_ID="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["id"])' /tmp/educore-release-response.json)"

          APK_STATUS="$(curl -sS \
            -o /tmp/educore-apk-upload.json \
            -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer $GITHUB_RELEASE_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "Content-Type: application/vnd.android.package-archive" \
            "https://uploads.github.com/repos/$REPO/releases/$RELEASE_ID/assets?name=EduCore.apk" \
            --data-binary "@$APK")"
          if [ "$APK_STATUS" != "201" ]; then
            echo "GitHub APK upload failed with HTTP $APK_STATUS; the incomplete release remains a draft."
            exit 1
          fi

          CHECKSUM_STATUS="$(curl -sS \
            -o /tmp/educore-checksum-upload.json \
            -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer $GITHUB_RELEASE_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "Content-Type: text/plain" \
            "https://uploads.github.com/repos/$REPO/releases/$RELEASE_ID/assets?name=EduCore.apk.sha256" \
            --data-binary "@$CHECKSUM")"
          if [ "$CHECKSUM_STATUS" != "201" ]; then
            echo "GitHub checksum upload failed with HTTP $CHECKSUM_STATUS; the incomplete release remains a draft."
            exit 1
          fi

          PUBLISH_STATUS="$(curl -sS \
            -o /tmp/educore-publish-response.json \
            -w '%{http_code}' \
            -X PATCH \
            -H "Authorization: Bearer $GITHUB_RELEASE_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "Content-Type: application/json" \
            "https://api.github.com/repos/$REPO/releases/$RELEASE_ID" \
            --data '{"draft":false}')"
          if [ "$PUBLISH_STATUS" != "200" ]; then
            echo "GitHub release publication failed with HTTP $PUBLISH_STATUS; the release remains a draft."
            exit 1
          fi

          echo "Published EduCore production release $TAG with APK and checksum assets."

    artifacts:
      - app/build/outputs/apk/debug/app-debug.apk
      - app/build/reports/lint-results-debug.html
      - app/build/reports/lint-results-release.html
      - app/build/outputs/apk/release/app-release.apk
      - app/build/outputs/apk/release/EduCore.apk
      - app/build/outputs/apk/release/EduCore.apk.sha256
