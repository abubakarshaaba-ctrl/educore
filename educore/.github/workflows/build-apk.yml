name: Build Staff App APK

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths: ['mobile/**']

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      # ── Decode release keystore from GitHub Secrets ──────────────────
      - name: Decode keystore
        if: env.KEYSTORE_BASE64 != ''
        run: echo "$KEYSTORE_BASE64" | base64 -d > android/app/educore-release.jks
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

      - name: Write key.properties
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "storePassword=$KEYSTORE_STORE_PASSWORD" > android/key.properties
          echo "keyPassword=$KEYSTORE_KEY_PASSWORD"     >> android/key.properties
          echo "keyAlias=$KEYSTORE_KEY_ALIAS"           >> android/key.properties
          echo "storeFile=educore-release.jks"          >> android/key.properties
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_STORE_PASSWORD: ${{ secrets.KEYSTORE_STORE_PASSWORD }}
          KEYSTORE_KEY_PASSWORD: ${{ secrets.KEYSTORE_KEY_PASSWORD }}
          KEYSTORE_KEY_ALIAS: ${{ secrets.KEYSTORE_KEY_ALIAS }}

      # ── Build ────────────────────────────────────────────────────────
      - run: flutter build apk --release --target-platform android-arm64

      - uses: actions/upload-artifact@v4
        with:
          name: educore-staff-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
