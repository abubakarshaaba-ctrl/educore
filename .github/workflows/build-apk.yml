name: LEGACY - Build Flutter Staff App APK

# Legacy workflow retained for historical/manual recovery only.
# The production EduCore Android application is now the native app under
# mobile-native/ on the mobile-build branch and is built/released by Codemagic.
# Do not use this workflow for normal production deployment.

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Decode keystore
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/educore-release.jks
            echo "Keystore decoded"
          else
            echo "KEYSTORE_BASE64 not set — legacy build may use debug signing"
          fi
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

      - name: Write key.properties
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "storePassword=$KEYSTORE_STORE_PASSWORD" > android/key.properties
            echo "keyPassword=$KEYSTORE_KEY_PASSWORD"     >> android/key.properties
            echo "keyAlias=$KEYSTORE_KEY_ALIAS"           >> android/key.properties
            echo "storeFile=educore-release.jks"          >> android/key.properties
          else
            echo "No legacy signing secrets configured"
          fi
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_STORE_PASSWORD: ${{ secrets.KEYSTORE_STORE_PASSWORD }}
          KEYSTORE_KEY_PASSWORD: ${{ secrets.KEYSTORE_KEY_PASSWORD }}
          KEYSTORE_KEY_ALIAS: ${{ secrets.KEYSTORE_KEY_ALIAS }}

      - name: Build legacy release APK
        run: flutter build apk --release --target-platform android-arm64

      - uses: actions/upload-artifact@v4
        with:
          name: legacy-educore-staff-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7

      - name: Build legacy AAB
        run: flutter build appbundle --release --target-platform android-arm64

      - uses: actions/upload-artifact@v4
        with:
          name: legacy-educore-play-aab
          path: mobile/build/app/outputs/bundle/release/app-release.aab
          retention-days: 7

# Intentionally no production deploy job.
# Production deployment belongs to the native mobile-build/Codemagic pipeline.
