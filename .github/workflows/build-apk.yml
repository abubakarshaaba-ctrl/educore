name: Build Staff App APK

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths: ['mobile/**']

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      # ── Decode release keystore from GitHub Secrets ──────────────────
      # Note: secrets context is not available in step-level 'if' conditions,
      # so we use a bash conditional to skip when the secret is empty.
      - name: Decode keystore
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/educore-release.jks
            echo "✅ Keystore decoded"
          else
            echo "⚠️ KEYSTORE_BASE64 not set — will use debug signing"
          fi
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

      - name: Write key.properties
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "storePassword=$KEYSTORE_STORE_PASSWORD" > android/key.properties
            echo "keyPassword=$KEYSTORE_KEY_PASSWORD"     >> android/key.properties
            echo "keyAlias=$KEYSTORE_KEY_ALIAS"           >> android/key.properties
            echo "storeFile=educore-release.jks"          >> android/key.properties
            echo "✅ key.properties written"
          else
            echo "⚠️ No keystore secrets — skipping key.properties"
          fi
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_STORE_PASSWORD: ${{ secrets.KEYSTORE_STORE_PASSWORD }}
          KEYSTORE_KEY_PASSWORD: ${{ secrets.KEYSTORE_KEY_PASSWORD }}
          KEYSTORE_KEY_ALIAS: ${{ secrets.KEYSTORE_KEY_ALIAS }}

      # ── Build APK (for direct download) ─────────────────────────────
      - run: flutter build apk --release --target-platform android-arm64

      - uses: actions/upload-artifact@v4
        with:
          name: educore-staff-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      # ── Build AAB (for Play Store submission) ───────────────────────
      - run: flutter build appbundle --release --target-platform android-arm64

      - uses: actions/upload-artifact@v4
        with:
          name: educore-play-aab
          path: mobile/build/app/outputs/bundle/release/app-release.aab
          retention-days: 30

  # ── Deploy APK to production server via SCP ───────────────────────
  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: educore-staff-apk

      - name: Upload APK to server
        if: env.DEPLOY_SSH_KEY != ''
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          source: app-release.apk
          target: ${{ secrets.DEPLOY_APK_PATH }}
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Rename to EduCore.apk on server
        if: env.DEPLOY_SSH_KEY != ''
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script: |
            cd ${{ secrets.DEPLOY_APK_PATH }}
            mv -f app-release.apk EduCore.apk 2>/dev/null || true
            echo "✅ Deployed EduCore.apk ($(stat -c%s EduCore.apk 2>/dev/null || echo 'unknown') bytes)"
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
