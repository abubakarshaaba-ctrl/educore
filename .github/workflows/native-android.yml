name: Validate Native Android App

on:
  workflow_dispatch:
  push:
    branches:
      - mobile-build
    paths:
      - 'mobile-native/**'
      - '.github/workflows/native-android.yml'

concurrency:
  group: native-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Run native unit tests lint and debug build
        working-directory: mobile-native
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --no-parallel \
            :core:common:testDebugUnitTest \
            :core:designsystem:testDebugUnitTest \
            :core:model:testDebugUnitTest \
            :core:network:testDebugUnitTest \
            :core:security:testDebugUnitTest \
            :core:data:testDebugUnitTest \
            :app:testDebugUnitTest \
            :app:lintDebug \
            :app:assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: educore-native-debug-${{ github.sha }}
          path: mobile-native/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
