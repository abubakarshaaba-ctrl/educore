name: Mobile Work Hours Validation

on:
  push:
    branches:
      - feat/conventional-work-hours-mobile-20260921
    paths:
      - 'mobile-native/**'
      - '.github/workflows/mobile-work-hours-validation.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Run native unit tests, lint and debug build
        working-directory: mobile-native
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --no-parallel \
            :core:common:testDebugUnitTest \
            :core:designsystem:testDebugUnitTest \
            :core:model:testDebugUnitTest \
            :core:network:testDebugUnitTest \
            :core:security:testDebugUnitTest \
            :core:data:testDebugUnitTest \
            :app:testDebugUnitTest \
            :app:lintDebug \
            :app:assembleDebug
